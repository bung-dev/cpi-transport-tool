plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.bung'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	implementation 'tools.jackson.dataformat:jackson-dataformat-yaml'
	testImplementation 'org.wiremock:wiremock-standalone:3.13.2'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('runLocalStubs', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.company.sap.cpitransport.stub.LocalCpiStubs'
}

tasks.register('extractUploadedArtifacts', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.company.sap.cpitransport.stub.UploadedArtifactExtractor'
}

def npmCommand = System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm'

tasks.register('frontendInstall', Exec) {
	workingDir = file('frontend')
	commandLine npmCommand, 'ci'
}

tasks.register('frontendBuild', Exec) {
	dependsOn 'frontendInstall'
	workingDir = file('frontend')
	commandLine npmCommand, 'run', 'build'
}

// AI-NOTE: processResources는 frontendBuild에 의존하지 않는다(test·bootRun은 npm 미실행) (근거: REQ-002 AC-2·AC-3a, run 20260929-frontend-ui).
// mustRunAfter는 같은 실행에 둘 다 있을 때 순서만 정한다. frontend/dist 존재 판정은 실행 시점(from 경로 해석)에 맡긴다 (근거: REQ-002 AC-1·AC-3a, spec-ISS-007, run 20260929-frontend-ui)
tasks.named('processResources') {
	from('frontend/dist') {
		into 'static'
	}
	mustRunAfter 'frontendBuild'
}

tasks.named('bootJar') {
	dependsOn 'frontendBuild'
}
