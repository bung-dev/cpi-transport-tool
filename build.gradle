plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.bung'
version = '0.6.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	implementation 'tools.jackson.dataformat:jackson-dataformat-yaml'
	testImplementation 'org.wiremock:wiremock-standalone:3.13.2'
}

// 버전 출처는 위 version 하나다. 커밋은 -PgitCommit → .git 파일 직접 읽기 → unknown 순서로 정한다.
// git 실행 파일을 부르지 않는다(Docker 빌드 이미지에는 git이 없다). worktree의 .git 파일(gitdir:)도 따라간다
def resolveGitCommit = { File root ->
	if (project.hasProperty('gitCommit') && project.property('gitCommit')) {
		def given = project.property('gitCommit').toString().trim()
		return given.length() > 7 ? given.substring(0, 7) : given
	}
	try {
		File gitDir = new File(root, '.git')
		if (gitDir.isFile()) {
			def line = gitDir.text.trim()
			if (!line.startsWith('gitdir:')) return 'unknown'
			def target = new File(line.substring('gitdir:'.length()).trim())
			gitDir = target.isAbsolute() ? target : new File(root, target.path)
		}
		File head = new File(gitDir, 'HEAD')
		if (!head.isFile()) return 'unknown'
		File commonDir = gitDir
		File commonFile = new File(gitDir, 'commondir')
		if (commonFile.isFile()) {
			def common = new File(commonFile.text.trim())
			commonDir = common.isAbsolute() ? common : new File(gitDir, common.path)
		}
		def headText = head.text.trim()
		String sha = null
		if (headText.startsWith('ref:')) {
			def ref = headText.substring('ref:'.length()).trim()
			for (File dir : [gitDir, commonDir]) {
				File refFile = new File(dir, ref)
				if (refFile.isFile()) { sha = refFile.text.trim(); break }
			}
			if (sha == null) {
				for (File dir : [gitDir, commonDir]) {
					File packed = new File(dir, 'packed-refs')
					if (!packed.isFile()) continue
					def hit = packed.readLines().find { !it.startsWith('#') && !it.startsWith('^') && it.endsWith(' ' + ref) }
					if (hit) { sha = hit.split(' ')[0]; break }
				}
			}
		} else {
			sha = headText
		}
		return (sha ==~ /[0-9a-f]{40}/) ? sha.substring(0, 7) : 'unknown'
	} catch (Exception ignored) {
		return 'unknown'
	}
}

springBoot {
	buildInfo {
		properties {
			additional = [commit: resolveGitCommit(rootDir)]
		}
	}
}

// 실행형 jar(bootJar) 하나만 만든다. Dockerfile·E2E가 build/libs의 jar를 이름(버전) 없이 찾는다 (근거: REQ-001·REQ-005·REQ-006)
tasks.named('jar') {
	enabled = false
}

tasks.named('test') {
	useJUnitPlatform()
	// 버전 테스트가 build-info 값과 build.gradle version을 비교한다 (근거: REQ-001)
	systemProperty 'app.expectedVersion', project.version.toString()
}

tasks.register('runLocalStubs', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.company.sap.cpitransport.stub.LocalCpiStubs'
}

tasks.register('runRealSampleStub', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.company.sap.cpitransport.stub.RealSampleStub'
	if (project.hasProperty('sampleVariant')) { systemProperty 'sample.variant', project.property('sampleVariant') }
}

tasks.register('extractUploadedArtifacts', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.company.sap.cpitransport.stub.UploadedArtifactExtractor'
}

def npmCommand = System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm'

tasks.register('frontendInstall', Exec) {
	workingDir = file('frontend')
	commandLine npmCommand, 'ci'
}

tasks.register('frontendBuild', Exec) {
	dependsOn 'frontendInstall'
	workingDir = file('frontend')
	commandLine npmCommand, 'run', 'build'
}

// processResources는 frontendBuild에 의존하지 않는다(test·bootRun은 npm 미실행).
// mustRunAfter는 같은 실행에 둘 다 있을 때 순서만 정한다. frontend/dist 존재 판정은 실행 시점(from 경로 해석)에 맡긴다 (근거: REQ-002 AC-1·AC-3a, spec-ISS-007)
tasks.named('processResources') {
	from('frontend/dist') {
		into 'static'
	}
	mustRunAfter 'frontendBuild'
}

tasks.named('bootJar') {
	dependsOn 'frontendBuild'
}
