services:
  app:
    build: .
    image: cpi-transport-tool:local
    ports:
      # 테넌트 자격증명을 다루므로 이 PC에서만 접속한다.
      - "127.0.0.1:8080:8080"
    environment:
      CPI_TENANT_STORE_KEY: ${CPI_TENANT_STORE_KEY:?set CPI_TENANT_STORE_KEY in .env (see docker.env.example)}
      CPI_TRANSPORT_READ_ONLY: ${CPI_TRANSPORT_READ_ONLY:-true}
      CPI_TRANSPORT_MAPPINGFILE: ${CPI_TRANSPORT_MAPPINGFILE:-}
    volumes:
      # 등록 테넌트(tenants.enc)와 이관 이력. 컨테이너를 다시 만들어도 남는다.
      - cpitt-data:/home/app/.cpi-transport-tool
      # 매핑 파일 폴더(git 무시). 이관할 때마다 읽으므로 수정 뒤 재기동이 필요 없다.
      - ./local:/config:ro

volumes:
  cpitt-data:
